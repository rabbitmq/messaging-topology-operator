apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: set-username-gen-pass-example # used as the RabbitMQ username
spec:
  tags:
  - management
  rabbitmqClusterReference:
    name: test # rabbitmqCluster must exist in the same namespace as this resource
  usernameFromMeta: true # the password is generated and stored in the Secret set-username-gen-pass-example-user-credentials
